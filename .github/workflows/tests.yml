name: Statistical Verification

on:
  push:
    branches:
      - main
      - v2-2026
  pull_request:
    branches:
      - main
      - v2-2026
  workflow_dispatch:

jobs:
  python-statistical-tests:
    name: Verification vs Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          if ! command -v lua &> /dev/null; then
            sudo update-alternatives --install /usr/bin/lua lua-interpreter /usr/bin/lua5.4 130
          fi
          lua -v

      - name: Install Python scientific packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy statsmodels scikit-learn pandas

      - name: Run cross-language statistical verification
        run: |
          python3 lua-regression/tests/verify_against_python.py
